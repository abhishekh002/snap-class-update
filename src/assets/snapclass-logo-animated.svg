<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ns1="http://c2pa.org/manifest" viewBox="0 0 640 180" width="1280" height="360" role="img" aria-label="SnapClass AI Attendance"><metadata><ns1:manifest></ns1:manifest></metadata>
<style>
  .loop{animation-duration:7s;animation-iteration-count:1;animation-timing-function:ease-out;animation-fill-mode:both}
  .all{animation-name:fadeall}
  .tile{animation-name:tile;transform-box:fill-box;transform-origin:center}
  .br{animation-name:draw;stroke-dasharray:1;stroke-dashoffset:1}
  .person{animation-name:person}
  .scan{animation-name:scan}
  .badge{animation-name:badge;transform-box:fill-box;transform-origin:center}
  .chk{animation-name:draw2;stroke-dasharray:1;stroke-dashoffset:1}
  .word{animation-name:word}
  .tag{animation-name:tag}
  @keyframes fadeall{0%,100%{opacity:1}}
  @keyframes tile{0%{transform:scale(.2) rotate(-25deg);opacity:0}8%{transform:scale(1.08) rotate(0);opacity:1}11%,100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes draw{0%,5%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
  @keyframes person{0%,13%{opacity:0;transform:translateY(8px)}24%,100%{opacity:1;transform:translateY(0)}}
  @keyframes scan{0%,25%{opacity:0;transform:translateY(0)}28%{opacity:.95}40%{opacity:.95;transform:translateY(86px)}42%,100%{opacity:0;transform:translateY(86px)}}
  @keyframes badge{0%,40%{transform:scale(0)}46%{transform:scale(1.25)}52%,100%{transform:scale(1)}}
  @keyframes draw2{0%,46%{stroke-dashoffset:1}58%,100%{stroke-dashoffset:0}}
  @keyframes word{0%,22%{opacity:0;transform:translateX(-24px)}38%,100%{opacity:1;transform:translateX(0)}}
  @keyframes tag{0%,40%{opacity:0;transform:translateX(-14px)}54%,100%{opacity:1;transform:translateX(0)}}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22DAFF" /><stop offset="1" stop-color="#22DAFF" /></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
  <clipPath id="c"><rect x="10" y="10" width="160" height="160" rx="44" /></clipPath>
</defs>
<g class="loop all">
  <rect class="loop tile" x="10" y="10" width="160" height="160" rx="44" fill="url(#g)" />
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path class="loop br" pathLength="1" d="M46 68V54Q46 46 54 46H68" />
    <path class="loop br" pathLength="1" d="M112 46H126Q134 46 134 54V68" />
    <path class="loop br" pathLength="1" d="M46 112V126Q46 134 54 134H68" />
  </g>
  <g class="loop person" fill="#fff">
    <circle cx="90" cy="78" r="15" />
    <path d="M62 118Q62 98 90 98Q118 98 118 118Z" />
  </g>
  <g clip-path="url(#c)"><rect class="loop scan" x="40" y="44" width="100" height="5" rx="2.5" fill="url(#s)" /></g>
  <g class="loop badge">
    <circle cx="128" cy="128" r="23" fill="#ffd84d" stroke="#fff" stroke-width="5" />
    <path class="loop chk" pathLength="1" d="M118 128l7 7 14-16" fill="none" stroke="#1d2233" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text class="loop word" x="196" y="106" font-family="Poppins,'Segoe UI',Helvetica,Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="-2" fill="#1d2233">Snap<tspan font-weight="300" fill="#00b8a3">Class</tspan></text>
  <text class="loop tag" x="200" y="146" font-family="Poppins,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#6b7289">AI ATTENDANCE</text>
</g>
</svg>