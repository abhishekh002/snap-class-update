<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snap Class teacher logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.t-fl{animation:t-fl 3s ease-in-out infinite}
@keyframes t-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.t-sp{transform-box:fill-box;transform-origin:center;animation:t-sp 2.4s ease-in-out infinite}
@keyframes t-sp{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.4) rotate(45deg)}}
.t-rg{transform-box:fill-box;transform-origin:center;animation:t-rg 2.4s ease-out infinite}
@keyframes t-rg{0%{transform:scale(1);opacity:.9}100%{transform:scale(4);opacity:0}}
.t-ts{transform-box:view-box;transform-origin:84px 52px;animation:t-ts 2s ease-in-out infinite}
@keyframes t-ts{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.t-fl,.t-sp,.t-rg,.t-ts{animation:none}}
</style>
<g class="t-fl">
<rect x="6" y="14" width="88" height="88" rx="22" fill="#22DAFF"/>
<polygon points="50,36 84,52 50,68 16,52" fill="#FFFFFF"/>
<path d="M32 61 L32 74 Q50 84 68 74 L68 61 L50 69 Z" fill="#FFFFFF"/>
<g class="t-ts">
<line x1="84" y1="52" x2="84" y2="72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<circle cx="84" cy="75" r="3.5" fill="#FFFFFF"/>
</g>
<circle class="t-rg" cx="86" cy="26" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<path class="t-sp" d="M86 16 L88.5 23.5 L96 26 L88.5 28.5 L86 36 L83.5 28.5 L76 26 L83.5 23.5 Z" fill="#FFFFFF"/>
</g>
</svg>
