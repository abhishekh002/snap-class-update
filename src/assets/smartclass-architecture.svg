<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SmartClass AI architecture</title>
  <desc id="desc">Architecture overview showing student and teacher portals, the Streamlit application, Supabase storage, face attendance processing, and the Gemini AI tutor with optional Zep knowledge retrieval.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f5ef"/><stop offset="1" stop-color="#e9efe5"/></linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f0e4"/><stop offset="1" stop-color="#dce8d8"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7f4f1"/><stop offset="1" stop-color="#d5e9e4"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbefe7"/><stop offset="1" stop-color="#f2dfd3"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#26382e" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#385844"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#287477"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#26382e}
      .title{font-size:38px;font-weight:700;letter-spacing:-1px}
      .subtitle{font-size:16px;fill:#65746a}
      .node-title{font-size:20px;font-weight:700}
      .kicker{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#287477}
      .copy{font-size:15px;fill:#526457}
      .small{font-size:13px;fill:#65746a}
      .tiny{font-size:11px;fill:#65746a}
      .arrow-label{font-size:12px;font-weight:700;fill:#385844}
      .number{font-size:13px;font-weight:700;fill:#26382e;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="26" fill="url(#page)"/>
  <rect x="18" y="18" width="1564" height="964" rx="22" fill="none" stroke="#8ebdb3" stroke-width="2"/>

  <text x="54" y="70" class="kicker">SMART LEARNING · CONNECTED CLASSROOMS</text>
  <text x="54" y="116" class="title">SmartClass AI Architecture</text>
  <text x="56" y="145" class="subtitle">Attendance, classroom resources, assessments, and context-aware study support in one Streamlit application.</text>

  <!-- Connectors are behind the component cards. -->
  <path d="M365 277H405" stroke="#385844" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1032 277H1068" stroke="#385844" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M475 390C475 430 280 420 280 464" stroke="#287477" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <path d="M780 393V438" stroke="#287477" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <path d="M1018 630H1064" stroke="#287477" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="178" width="315" height="212" rx="22" fill="#fffefa" stroke="#dce1d6" stroke-width="1.5"/>
    <rect x="50" y="178" width="315" height="7" rx="4" fill="#b97453"/>
    <text x="76" y="216" class="kicker">PEOPLE</text>
    <text x="76" y="247" class="node-title">Students &amp; Teachers</text>
    <circle cx="101" cy="296" r="22" fill="#e7f1ea"/>
    <circle cx="101" cy="289" r="7" fill="none" stroke="#287477" stroke-width="2.5"/>
    <path d="M87 316c1-10 6-15 14-15s13 5 14 15" fill="none" stroke="#287477" stroke-width="2.5" stroke-linecap="round"/>
    <text x="137" y="290" class="copy">Face ID check-in · classes</text>
    <text x="137" y="312" class="copy">Attendance · learning tools</text>
    <text x="76" y="357" class="small">Use the student or teacher workspace.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="178" width="622" height="212" rx="22" fill="url(#teal)" stroke="#b8d8d0" stroke-width="1.5"/>
    <rect x="410" y="178" width="622" height="7" rx="4" fill="#287477"/>
    <text x="438" y="216" class="kicker">APPLICATION · STREAMLIT + PYTHON</text>
    <text x="438" y="247" class="node-title">SmartClass Web App</text>
    <rect x="438" y="267" width="170" height="52" rx="13" fill="#fffefa" stroke="#d3e5df"/>
    <rect x="625" y="267" width="170" height="52" rx="13" fill="#fffefa" stroke="#d3e5df"/>
    <rect x="812" y="267" width="190" height="52" rx="13" fill="#fffefa" stroke="#d3e5df"/>
    <text x="523" y="289" text-anchor="middle" class="small" font-weight="700">Student Portal</text>
    <text x="523" y="307" text-anchor="middle" class="tiny">Face ID · classes · notes</text>
    <text x="710" y="289" text-anchor="middle" class="small" font-weight="700">Teacher Portal</text>
    <text x="710" y="307" text-anchor="middle" class="tiny">Attendance · resources</text>
    <text x="907" y="289" text-anchor="middle" class="small" font-weight="700">AI Learning Studio</text>
    <text x="907" y="307" text-anchor="middle" class="tiny">Chat · uploads · assessments</text>
    <text x="438" y="356" class="small">Streamlit handles the interface and runs the Python application logic.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1070" y="178" width="480" height="212" rx="22" fill="#fffefa" stroke="#dce1d6" stroke-width="1.5"/>
    <rect x="1070" y="178" width="480" height="7" rx="4" fill="#829a79"/>
    <text x="1098" y="216" class="kicker">DATABASE &amp; FILE STORAGE</text>
    <text x="1098" y="247" class="node-title">Supabase</text>
    <rect x="1098" y="267" width="198" height="74" rx="14" fill="url(#sage)" stroke="#d1dfcc"/>
    <rect x="1310" y="267" width="212" height="74" rx="14" fill="url(#peach)" stroke="#ecd7c9"/>
    <text x="1197" y="292" text-anchor="middle" class="small" font-weight="700">Postgres</text>
    <text x="1197" y="313" text-anchor="middle" class="tiny">Profiles · classes · attendance</text>
    <text x="1416" y="292" text-anchor="middle" class="small" font-weight="700">Private Storage</text>
    <text x="1416" y="313" text-anchor="middle" class="tiny">Course notes · assessment files</text>
    <text x="1098" y="367" class="small">App data and classroom files persist here.</text>
  </g>

  <!-- numbered flow markers -->
  <g><circle cx="385" cy="277" r="16" fill="#f8e9bf" stroke="#d89522" stroke-width="2"/><text x="385" y="277" class="number">1</text></g>
  <g><circle cx="1050" cy="277" r="16" fill="#f8e9bf" stroke="#d89522" stroke-width="2"/><text x="1050" y="277" class="number">2</text></g>
  <g><circle cx="375" cy="424" r="16" fill="#f8e9bf" stroke="#d89522" stroke-width="2"/><text x="375" y="424" class="number">3</text></g>
  <g><circle cx="405" cy="424" r="16" fill="#f8e9bf" stroke="#d89522" stroke-width="2"/><text x="405" y="424" class="number">4</text></g>
  <g><circle cx="780" cy="416" r="16" fill="#f8e9bf" stroke="#d89522" stroke-width="2"/><text x="780" y="416" class="number">5</text></g>
  <g><circle cx="1041" cy="630" r="16" fill="#f8e9bf" stroke="#d89522" stroke-width="2"/><text x="1041" y="630" class="number">6</text></g>

  <g filter="url(#shadow)">
    <rect x="50" y="470" width="460" height="328" rx="22" fill="url(#sage)" stroke="#d1dfcc" stroke-width="1.5"/>
    <rect x="50" y="470" width="460" height="7" rx="4" fill="#829a79"/>
    <text x="78" y="510" class="kicker">LOCAL COMPUTER-VISION FLOW</text>
    <text x="78" y="542" class="node-title">Face ID &amp; Attendance</text>
    <rect x="78" y="566" width="170" height="80" rx="14" fill="#fffefa" stroke="#dce1d6"/>
    <rect x="270" y="566" width="208" height="80" rx="14" fill="#fffefa" stroke="#dce1d6"/>
    <text x="163" y="592" text-anchor="middle" class="small" font-weight="700">Camera / class photo</text>
    <text x="163" y="615" text-anchor="middle" class="tiny">Student check-in or teacher upload</text>
    <text x="374" y="592" text-anchor="middle" class="small" font-weight="700">Face pipeline</text>
    <text x="374" y="615" text-anchor="middle" class="tiny">dlib embeddings · local match</text>
    <path d="M248 606h17" stroke="#385844" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="78" y="687" class="copy">1. Detect faces and compare against enrolled profiles.</text>
    <text x="78" y="715" class="copy">2. Save confirmed attendance records to Supabase.</text>
    <rect x="78" y="744" width="400" height="30" rx="15" fill="#e9f4ec" stroke="#cbded0"/>
    <text x="278" y="764" text-anchor="middle" class="tiny" font-weight="700">Face matching runs in the SnapClass Python environment.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="470" width="478" height="328" rx="22" fill="#fffefa" stroke="#dce1d6" stroke-width="1.5"/>
    <rect x="540" y="470" width="478" height="7" rx="4" fill="#b97453"/>
    <text x="568" y="510" class="kicker">STUDY &amp; TEACHING</text>
    <text x="568" y="542" class="node-title">AI Learning Studio</text>
    <rect x="568" y="566" width="422" height="54" rx="13" fill="url(#teal)" stroke="#d3e5df"/>
    <text x="588" y="590" class="small" font-weight="700">Text chat + supported documents</text>
    <text x="588" y="608" class="tiny">PDF · DOCX · PPTX · TXT · Markdown · CSV</text>
    <rect x="568" y="632" width="422" height="54" rx="13" fill="url(#peach)" stroke="#ecd7c9"/>
    <text x="588" y="656" class="small" font-weight="700">Image questions + board digitizing</text>
    <text x="588" y="674" class="tiny">Gemini reads images, worksheets, and board photos.</text>
    <text x="568" y="722" class="copy">Answers can use optional Zep knowledge-graph context.</text>
    <text x="568" y="750" class="small">Teachers publish assessments; students submit and review results.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1070" y="470" width="480" height="328" rx="22" fill="#eaf1f3" stroke="#c8d9df" stroke-width="1.5"/>
    <rect x="1070" y="470" width="480" height="7" rx="4" fill="#315b54"/>
    <text x="1098" y="510" class="kicker">AI &amp; CONTEXT SERVICES</text>
    <text x="1098" y="542" class="node-title">Gemini Study Tutor</text>
    <rect x="1098" y="566" width="424" height="76" rx="14" fill="#fffefa" stroke="#dce1d6"/>
    <text x="1310" y="591" text-anchor="middle" class="small" font-weight="700">Google Gemini</text>
    <text x="1310" y="614" text-anchor="middle" class="tiny">Text · documents · images · board notes</text>
    <rect x="1098" y="656" width="424" height="76" rx="14" fill="#fffefa" stroke="#dce1d6"/>
    <text x="1310" y="681" text-anchor="middle" class="small" font-weight="700">Zep · optional</text>
    <text x="1310" y="704" text-anchor="middle" class="tiny">Knowledge-graph retrieval context</text>
    <text x="1098" y="769" class="tiny">Gemini uses the configured Google API key.</text>
  </g>

  <g>
    <rect x="50" y="842" width="1500" height="92" rx="18" fill="#fffefa" stroke="#dce1d6"/>
    <text x="78" y="875" class="kicker">FLOW</text>
    <text x="78" y="905" class="small" font-weight="700">1</text><text x="96" y="905" class="small">Student / teacher opens a portal</text>
    <text x="360" y="905" class="small" font-weight="700">2</text><text x="378" y="905" class="small">App reads and writes classroom data</text>
    <text x="686" y="905" class="small" font-weight="700">3–4</text><text x="720" y="905" class="small">Face match → attendance record</text>
    <text x="1015" y="905" class="small" font-weight="700">5–6</text><text x="1049" y="905" class="small">AI request → provider → response</text>
    <text x="78" y="922" class="tiny">This project uses Streamlit for the UI and Python logic. Supabase stores app data; optional Zep adds retrieved study context.</text>
  </g>
</svg>
